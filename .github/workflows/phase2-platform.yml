# Platform qualification for the Phase 2 ownership substrate (T-0629, SB-12).
#
# Deliberately a separate workflow rather than extra jobs in `core-acceptance.yml`.
# That file defines the single merge-blocking check `Core acceptance`, and a matrix
# expands job names to `<name> (<os>)`, so folding these rows in would rename the
# required check and silently drop the rule that references the exact string. The
# acceptance workflow's own tests pin it to one job for that reason.
#
# Whether these rows are required by branch protection or a ruleset is a
# repository setting outside this tree, so this file cannot assert it either
# way -- the same limitation `core-acceptance.yml`'s own header records for
# `Core acceptance`, and that `tests/test_core_acceptance_workflow.py` states
# explicitly it cannot verify. What is certain here: making them required
# should not happen until the Windows row has passed once, because a rule
# pointing at a check that has never been green blocks every merge.
name: Phase 2 platform qualification

on:
  pull_request:
  workflow_dispatch:

# Cancels all three matrix rows of a superseded run together. Keyed on the pull
# request number, so only a newer run for the same pull request can cancel it,
# and that run reports the same three required check names in its place.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase2-platform:
    name: Phase 2 platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every row runs. One platform failing is the result, not a reason to stop
      # collecting the others -- and the Windows row is the one with no prior
      # evidence at all, so losing it to an unrelated macOS failure would defeat
      # the point of adding this.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python tooling and local packages
        # Order is the whole content of this step. `omnivia-core` is unpublished,
        # so the only thing that can satisfy the `omnivia-core>=0.1.0,<0.2.0`
        # dependency of `omnivia-memory` and of the four local packages is this
        # checkout -- installed first, or pip goes to the index and fails to
        # resolve it. `omnivia-memory[dev]` itself was missing entirely, which is
        # why FM-22's `import omnivia_memory` failed on macOS and Windows.
        #
        # `omnivia-core-client` obeys that same rule one edge further down: it is
        # as unpublished as `omnivia-core`, and `omnivia-core-cli` declares it, so
        # the CLI install below resolves against the index and fails unless the
        # client precedes it. Packet section 17b.2. The named-pipe parity suite
        # below also imports the shared client directly.
        #
        # Every argument is quoted so the one line with shell metacharacters
        # (`[`, `]`, `>`, `<`) is a literal in bash, zsh and PowerShell alike; the
        # matrix runs the same script on all three default hosted shells.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "hatchling>=1.26,<2" "jsonschema[format]>=4.25,<5" pytest
          python -m pip install -e .
          python -m pip install -e "services/omnivia-memory[dev]"
          python -m pip install -e packages/omnivia-core-runtime
          python -m pip install -e packages/omnivia-core-client
          python -m pip install -e packages/omnivia-core-cli
          python -m pip install -e packages/omnivia-core-mcp

      - name: Run Phase 2 acceptance suite
        run: python -m pytest packages/omnivia-core-runtime/tests/phase2 -q -rs

      - name: Run Windows named-pipe client parity
        # Deterministic Runtime cases run everywhere. The real pipe cases state
        # their platform requirement explicitly and execute in the Windows row,
        # including a public LocalIpcTransport call against the real listener.
        run: python -m pytest packages/omnivia-core-runtime/tests/phase3/protocol/test_windows_named_pipe.py -q -rs

      - name: Qualify isolated-wheel MCP and CLI executables
        # Cross-platform by construction: this Python driver creates two clean
        # environments, installs wheels only, and invokes the actual console
        # entry points through this row's native shell. There is no skip path.
        run: python scripts/check-v06-6-executables.py

      - name: Build and qualify Standard distribution candidate
        # One platform candidate per matrix row. The builder uses the reviewed
        # dependency constraints, installs only from its wheelhouse, drives the
        # installed CLI/service/MCP journey, and records the unsigned state
        # explicitly rather than implying release signing happened here.
        run: python scripts/build-standard-candidate.py --output standard-candidate

      - name: Retain Standard candidate evidence
        uses: actions/upload-artifact@v6
        with:
          name: omnivia-standard-${{ runner.os }}-${{ runner.arch }}
          path: standard-candidate
          if-no-files-found: error
          retention-days: 7

      - name: Assert this platform's lock case actually ran
        # The whole point of the matrix. `msvcrt` byte-range locking has exactly one
        # dedicated case and it has never executed on any machine, so a silent skip
        # here would leave the Windows row green while proving nothing.
        run: python scripts/check-platform-lock-coverage.py

      - name: Build and test the macOS status menu companion
        # Keep the protected three-row matrix and its exact check names intact.
        # The package imports AppKit, so only the existing macOS row can build
        # it; the same command is a deliberate no-op on Linux and Windows.
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            swift build --package-path apps/core-status-menu-macos
            swift test --package-path apps/core-status-menu-macos
          else
            echo "skipped: the status menu companion requires macOS AppKit"
          fi
