# Qualification-only branch configuration for P1b's native Windows descriptor
# owner/DACL, file-kind/reparse-point, and replacement-race regressions. Product
# files come from the exact independently reviewed P1b candidate commit.
name: P1b native Windows qualification

on:
  pull_request:
  workflow_dispatch:

jobs:
  phase2-platform:
    name: P1b native descriptor provenance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out exact reviewed P1b candidate
        uses: actions/checkout@v7
        with:
          ref: 097018d265fe79ee0f06d39df4ac29c3e276fb20

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assert exact reviewed identity
        shell: pwsh
        run: |
          $expected = "097018d265fe79ee0f06d39df4ac29c3e276fb20"
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "reviewed identity mismatch" }

      - name: Install Python tooling and local packages
        # Order is the whole content of this step. `omnivia-core` is unpublished,
        # so the only thing that can satisfy the `omnivia-core>=0.1.0,<0.2.0`
        # dependency of `omnivia-memory` and of the three local packages is this
        # checkout -- installed first, or pip goes to the index and fails to
        # resolve it. `omnivia-memory[dev]` itself was missing entirely, which is
        # why FM-22's `import omnivia_memory` failed on macOS and Windows.
        #
        # Every argument is quoted so the one line with shell metacharacters
        # (`[`, `]`, `>`, `<`) is a literal in bash, zsh and PowerShell alike; the
        # qualification runs in the default hosted PowerShell.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema[format]>=4.25,<5" pytest
          python -m pip install -e .
          python -m pip install -e "services/omnivia-memory[dev]"
          python -m pip install -e packages/omnivia-core-runtime
          python -m pip install -e packages/omnivia-core-cli
          python -m pip install -e packages/omnivia-core-mcp
          python -m pip install -e packages/omnivia-core-client

      - name: Qualify P1b native descriptor provenance
        run: python -m pytest packages/omnivia-core-client/tests/test_discovery.py -q -rs
