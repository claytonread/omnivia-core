[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core"
version = "0.1.0"
description = "Public OmniVia core primitives for local-first knowledge modeling, persistence, graph links, ingestion, provenance, workspace modeling, and basic search."
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core"]

# `contracts/application/v1/{schemas,fixtures}` stay the only checked-in
# canonical copy (ADR-038), and `contracts/host/v1/{schemas,fixtures}` the only
# checked-in copy of the exact Host Contract v1.0.0 bytes DOC-004 section AA
# incorporates. This force-includes them into the built wheel under importable
# resource paths alongside each version package's Python modules, without
# duplicating them anywhere else in the source tree. The Host Contract fixtures
# keep their governed category directories (valid, invalid, denial, degradation,
# migration), which the force-include preserves.
[tool.hatch.build.targets.wheel.force-include]
"contracts/application/v1/schemas" = "omnivia_core/contracts/v1/resources/schemas"
"contracts/application/v1/fixtures" = "omnivia_core/contracts/v1/resources/fixtures"
"contracts/host/v1/schemas" = "omnivia_core/host_contract/v1/resources/schemas"
"contracts/host/v1/fixtures" = "omnivia_core/host_contract/v1/resources/fixtures"

# Canonical collection scope. Every tree in this checkout that holds tests is
# named here, so a bare `pytest -q` from the repository root is the whole suite
# and not a subset of it.
#
# It used to read `["services", "tests"]`, which silently excluded everything
# under `packages/` -- the runtime, client, CLI and MCP distributions. A bare run
# reported a green 9358-test pass while collecting none of the 3828 cases in
# those trees, and the acceptance workflow hid the gap because it names its paths
# explicitly (naming paths disables `testpaths` entirely). `baseline/tests` and
# `benchmarks/tests` were outside it for the same reason and are now included:
# both have their own gate step, and neither needs anything a bare run does not
# already provide.
#
# `scripts/check-test-collection.py` holds this open. It compares the files a
# bare run actually collects against every test file on disk, so a tree added
# outside this list fails rather than disappearing.
[tool.pytest.ini_options]
testpaths = ["services", "tests", "packages", "baseline/tests", "benchmarks/tests"]
pythonpath = ["src"]

# Ruff resolves the *nearest* `[tool.ruff]` above each file, so this section is
# the configuration for every canonical tree -- `src`, `packages`, `baseline`,
# `tests`, `scripts` -- and for anything added beside them.
# `services/omnivia-memory` keeps its own separate declaration (ADR-036 legacy
# facade) and is unaffected by this one.
#
# Scope. A bare `ruff check` from the repository root now lints exactly what the
# acceptance workflow's `Run Ruff` step lints, so a clean local run means a clean
# gate. `benchmarks` is the one tree excluded: it has never been in the accepted
# clean scope and currently carries 37 findings. Excluding it here makes that a
# recorded decision rather than an accident of which paths the workflow happened
# to name, and an explicit `ruff check benchmarks` still lints it -- Ruff applies
# `exclude` to directory walks, not to paths given on the command line.
[tool.ruff]
target-version = "py311"
extend-exclude = ["benchmarks"]

# The rule set is not pinned by enumerating it, because it cannot honestly be:
# Ruff 0.16.1's default selection is 413 rules -- 38 code prefixes, 34 upstream
# linters -- and the canonical trees satisfy all of them with zero findings.
# `E4`/`E7`/`E9`/`F`, which `services/omnivia-memory` selects for the ADR-036
# legacy facade, resolves to 59, and the two sets are not nested: 41 in both,
# 372 only in the default, 18 only in the facade selection. So restating the
# four-family baseline here would not narrow policy -- it would change it in
# both directions, dropping 372 rules and adding 18, while reading like a
# tightening.
#
# Decision taken. Those 18 went unchecked in `src`, `packages`, `baseline`,
# `tests` and `scripts`, and they are correctness rules rather than style --
# `== None`, `== True`, `type(x) ==`, `lambda` assignment, ambiguous names,
# imports after code, star imports. They are now enabled by name in
# `[tool.ruff.lint] extend-select` below: the small, measurable version of
# declaring a selection, which closes the facade-only gap without restating the
# 413 defaults. Adopting them cost four findings, every one of them E402 and
# every one the deliberate `sys.path` bootstrap in `scripts/`, suppressed at the
# four sites rather than by a rule- or path-wide exclusion.
#
# `required-version` pins it instead, and Ruff is pre-1.0, so a minor bump is
# where its rule selection is allowed to move -- `<0.17` is that boundary, not an
# arbitrary one. Patch releases inside 0.16.x are accepted.
#
# What this does and does not do. It does NOT by itself stop a newer Ruff from
# reaching the gate: it aborts the run -- exit 2, before a single file is linted
# -- when one already has. The thing that keeps a newer Ruff out is the matching
# bound on `services/omnivia-memory[dev]`'s `ruff` requirement, which is the only
# Ruff requirement in this repository that pip can install and therefore the only
# one that decides what the acceptance gate runs. This entry is the consistency
# check on that bound: it catches Ruff arriving from anywhere the bound does not
# govern -- a workflow that installs Ruff directly, a transitive dependency, a
# developer's globally installed copy.
#
# Left as an abort with no matching bound, this line is a scheduled outage: the
# day Ruff 0.17.0 publishes, every pull request fails at `Run Ruff`. It was
# exactly that for one revision of this file. The two ranges are held identical
# by `test_every_declared_ruff_version_matches_the_required_version` in
# `tests/test_core_acceptance_workflow.py`, which reads them both from the tree,
# and the bound is held reachable by
# `test_the_ruff_bound_is_reachable_by_the_installs_the_gate_runs`.
#
# The accepted maintenance cost: adopting a new Ruff minor means editing two
# strings, and the tests above name the second one if it is missed.
required-version = ">=0.16.1,<0.17"

[tool.ruff.lint]
# The 18 rules that `services/omnivia-memory`'s `E4`/`E7`/`E9`/`F` selection
# catches and Ruff's default selection does not -- the facade-only side of the
# gap measured under `[tool.ruff]` above. Enabled by name so the canonical trees
# are held to them too. `extend-select` adds to the default selection instead of
# replacing it, so all 413 defaults stay in force and are not restated here.
extend-select = [
    "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714",
    "E721", "E731", "E741", "E742", "E743", "F403", "F405", "F406", "F722",
]

# Deliberately not enabled, with reasons.
#
# `B904` (`raise-without-from-inside-except`) is not in Ruff's default selection
# today, and this entry is what keeps it out if that changes or if someone adds
# it via `select`/`extend-select` -- `ignore` wins over both. It is the one rule
# that would actively contradict an accepted repository decision. Its own message
# is the proof: "raise exceptions with `raise ... from err` or `raise ... from
# None`". The second of those is exactly what
# `scripts/check-raise-discipline.py` forbids on the unauthenticated seams,
# because `from None` clears `__cause__` while leaving the original exception --
# and whatever caller-supplied text it quoted -- reachable on `__context__`.
# Enabling B904 would therefore drive authors toward the disclosure defect that
# script exists to catch. Verified both ways: B904 passes a `raise X from None`
# handler, and fires on the compliant `raise X`.
#
# `TRY200` was the same rule under its old code and no longer exists in Ruff, so
# there is nothing to list for it. See that script's module docstring for the
# disclosure defects behind the convention.
ignore = ["B904"]

# Not enabled, and not a policy conflict -- just too large to adopt in this lane.
# Measured with `ruff check --select ALL` over `src packages baseline tests
# scripts`, which reports 28429 findings in total. The families worth a separate
# decision, with their counts:
#
#   S      7129  (S101 `assert` alone is 6875 -- tests are the whole tree)
#   E      6662  (E501 line-too-long is 6658; there is no formatter gate here)
#   D      4859  (docstring style; 2669 are undocumented public functions)
#   COM    4201  (missing trailing comma; a formatter decision, not a lint one)
#   EM     1293
#   TRY    1280  (1273 are TRY003 raise-vanilla-args)
#   ANN     605
#   PLR     517
#   CPY     271
#   PT      234
#
# The plausible small ones, for a follow-up that wants cheap coverage:
# `RUF` 97, `C` 96, `Q` 82, `PERF` 73, `SIM` 41, `N` 38, `PLW` 18, `PTH` 16,
# `SLOT` 8, `I` 5, `A` 5, `B` 4 (all B905; B904 has zero sites today), `PGH` 3,
# `ERA` 3, `ISC` 1, `ICN` 1.

[dependency-groups]
# Development-only tooling. Runtime dependencies stay empty: the public
# contract package (src/omnivia_core/contracts) is standard-library only.
# The `format` extra pulls in `rfc3339-validator` so `jsonschema.FormatChecker`
# enforces true RFC 3339 calendar validity, not just Timestamp's lexical
# pattern; it stays conformance-only, never a runtime dependency.
#
# `build` and `hatchling` are here because collected tests build a wheel from
# this checkout: `tests/host_contract/test_host_wheel_resources.py` proves the
# packaged Host Contract resources import from a real isolated install, and it
# builds with isolation disabled, so the backend has to be in the environment
# already. Without them those tests fail at setup for a missing build backend --
# an environment gap that reads exactly like a product defect. The CI workflow
# installs both explicitly for `scripts/check-package-builds.sh`; declaring them
# here makes a `uv sync` environment able to run the suite too. Both stay
# development-only: runtime dependencies remain empty.
#
# Reachability, because it is not obvious and a previous revision of this comment
# got it wrong. This is a PEP 735 `[dependency-groups]` table, not
# `[project.optional-dependencies]`. `uv sync` installs it by default. **pip
# cannot install it at all**: this project declares no extras, so
# `pip install -e ".[dev]"` emits `WARNING: omnivia-core 0.1.0 does not provide
# the extra 'dev'` and installs nothing from here, and the built wheel carries
# zero `Requires-Dist` and zero `Provides-Extra` lines. Both measured.
#
# So `ruff` below serves `uv sync` users, who get a version satisfying
# `[tool.ruff] required-version` and can run the canonical bare `ruff check`. It
# does **not** reach CI, which installs with pip. The bound that governs CI lives
# in `services/omnivia-memory/pyproject.toml`; all three strings are held
# identical by `tests/test_core_acceptance_workflow.py`.
dev = [
    "build>=1.2,<2",
    "hatchling>=1.26,<2",
    "jsonschema[format]>=4.25,<5",
    "ruff>=0.16.1,<0.17",
    "types-jsonschema>=4.25,<5",
]
