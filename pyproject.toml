[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core"
version = "0.1.0"
description = "Public OmniVia core primitives for local-first knowledge modeling, persistence, graph links, ingestion, provenance, workspace modeling, and basic search."
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core"]

[tool.pytest.ini_options]
testpaths = ["services", "tests"]
