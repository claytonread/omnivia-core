[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivia-memory"
version = "0.1.0"
# DEPRECATION NOTICE (ADR-036). This distribution is a compatibility facade: it
# adds no implementation of its own for the contracts it publishes, and every
# name its package root advertises is imported unchanged from `omnivia_core`.
# The notice lives here, in the release metadata, and in README.md's Migration
# section -- deliberately *not* as a `warnings.warn`, log line, or anything else
# that runs at import time and pollutes a consumer's output. See
# `tests/compatibility/test_root_facade_distribution.py`, which asserts both the
# wording below and that importing the package stays silent.
description = "DEPRECATED compatibility facade for omnivia-core: import from omnivia_core instead of omnivia_memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
# Published migration guidance. This is the repository path that holds this
# distribution's README, whose Migration section is the canonical instruction
# set for consumers; it is a real, reachable location rather than a placeholder.
Migration = "https://github.com/claytonread/omnivia-core/tree/main/services/omnivia-memory#migration"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    # This is the only `ruff` requirement in the repository that pip can reach,
    # and therefore the only thing that decides which Ruff the acceptance gate
    # runs: `.github/workflows/core-acceptance.yml` installs this extra and never
    # names Ruff itself. The root pyproject's `[dependency-groups] dev` entry is
    # PEP 735 and pip does not install it.
    #
    # The bound must stay string-identical to `[tool.ruff] required-version` in
    # the root pyproject, which aborts Ruff outright -- exit 2, nothing linted --
    # when the running version falls outside it. Left unbounded, the first Ruff
    # release outside that range would be installed here and abort the gate on
    # every pull request. `test_every_declared_ruff_version_matches_the_required_version`
    # in `tests/test_core_acceptance_workflow.py` fails if the two drift apart,
    # and `test_the_ruff_bound_is_reachable_by_the_installs_the_gate_runs` fails
    # if the workflow stops installing this extra.
    "ruff>=0.16.1,<0.17",
    # Pinned to the major CI actually validates against. The floor was >=1.10.0
    # with no ceiling, and the two disagree: mypy 1.20.2 reports two
    # no-any-return errors on a tree that 2.3.0 -- what CI installs -- finds
    # clean. A merge-blocking gate that answers differently depending on when
    # the venv was built is not a gate. The ceiling is the major, so patch and
    # minor releases still arrive.
    "mypy>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

# Lint semantics are declared explicitly so they do not float with the Ruff
# version. E4/E7/E9/F is the intended baseline for this tree: import errors,
# statement-level errors, syntax errors, and pyflakes. This matches the
# declaration Platform carries for its sibling service, so the cross-repo
# `ship:preflight` Python lint applies one rule set to both trees.
#
# Scope note: this file is the nearest Ruff configuration for the whole
# `services/omnivia-memory` tree, which is the deprecated compatibility facade
# (ADR-036). Core's own acceptance gate lints the canonical trees (`src`,
# `packages`, `baseline`, `tests`, `scripts`) plus a named list of converted
# files under this tree; the rest of the legacy tree is deliberately out of that
# clean scope.
#
# Rule sets, measured under Ruff 0.16.1 -- and the two are not nested. The
# canonical trees carry no `select` of their own: the root `[tool.ruff]` they
# resolve pins the Ruff *version* and leaves the rule list to Ruff, so they run
# its implicit default -- 413 rules, zero findings -- and not the E4/E7/E9/F
# declared below. 41 of the 59 rules that selection resolves to are in that
# default too; 372 run only in the canonical trees; 18 run only here:
#
#   E401 E402 E701 E702 E703 E711 E712 E713 E714 E721
#   E731 E741 E742 E743 F403 F405 F406 F722
#
# `== None`, `== True`, `type(x) ==`, `lambda` assignment, ambiguous names,
# imports after code, star imports. Nothing checks the canonical trees for those
# today. An earlier revision of this note had the relation backwards, after
# Ruff's implicit set widened underneath it.
#
# Unsettled, deliberately. Declaring the canonical selection explicitly is
# outstanding work, and *which* rules it should hold is a decision nobody has
# made: putting E4/E7/E9/F there would drop 372 rules and add 18 while reading
# like a tightening. Changing this tree's own `select` is out of scope either
# way.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
