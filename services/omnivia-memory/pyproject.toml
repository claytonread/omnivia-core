[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivia-memory"
version = "0.1.0"
# DEPRECATION NOTICE (ADR-036). This distribution is a compatibility facade: it
# adds no implementation of its own for the contracts it publishes, and every
# name its package root advertises is imported unchanged from `omnivia_core`.
# The notice lives here, in the release metadata, and in README.md's Migration
# section -- deliberately *not* as a `warnings.warn`, log line, or anything else
# that runs at import time and pollutes a consumer's output. See
# `tests/compatibility/test_root_facade_distribution.py`, which asserts both the
# wording below and that importing the package stays silent.
description = "DEPRECATED compatibility facade for omnivia-core: import from omnivia_core instead of omnivia_memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
# Published migration guidance. This is the repository path that holds this
# distribution's README, whose Migration section is the canonical instruction
# set for consumers; it is a real, reachable location rather than a placeholder.
Migration = "https://github.com/claytonread/omnivia-core/tree/main/services/omnivia-memory#migration"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

# Lint semantics are declared explicitly so they do not float with the Ruff
# version. The dev extra pins only ``ruff>=0.4.0``, and Ruff's implicit rule set
# widens between releases, so an unstated selection makes CI results depend on
# whichever Ruff the runner resolves. E4/E7/E9/F is the intended baseline:
# import errors, statement-level errors, syntax errors, and pyflakes. This
# matches the declaration Platform carries for its sibling service, so the
# cross-repo `ship:preflight` Python lint applies one rule set to both trees.
#
# Scope note: this file is the nearest Ruff configuration for the whole
# `services/omnivia-memory` tree, which is the deprecated compatibility facade
# (ADR-036). Core's own acceptance gate lints the canonical trees (`src`,
# `packages`, `baseline`, `tests`, `scripts`) plus a named list of converted
# files under this tree; the rest of the legacy tree is deliberately out of that
# clean scope. Those canonical trees resolve no `[tool.ruff]` of their own and
# are intentionally left on Ruff's implicit set, which they satisfy -- narrowing
# them here is not in scope and would reduce, not restore, their coverage.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
