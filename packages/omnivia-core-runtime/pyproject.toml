[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core-runtime"
version = "0.1.0"
description = "Operational OmniVia Core local service: fenced workspace storage and migrations, ownership and recovery, durable jobs, and the application operation surface. Depends on omnivia-core; does not implement the Agent Runtime domain."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
]

[project.scripts]
omnivia-core-service = "omnivia_core_runtime.service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core_runtime"]
