[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core-runtime"
version = "0.1.0"
description = "Operational OmniVia Core local service with fenced storage, durable jobs, and the canonical Agent Runtime persistence, command, replay, scheduler, and wait foundation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
]

[project.scripts]
omnivia-core-service = "omnivia_core_runtime.service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core_runtime"]
