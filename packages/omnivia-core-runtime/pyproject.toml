[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core-runtime"
version = "0.1.0"
description = "Operational OmniVia Core local service with fenced storage, durable jobs, and the canonical Agent Runtime persistence, command, replay, scheduler, and wait foundation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# `cryptography` is here for exactly one thing: Ed25519 verification of a runtime
# payload's detached release signature in
# `omnivia_core_runtime.distribution.trusted_runtime`. The bound is the reviewed
# closure in `scripts/mcp-wheelhouse-constraints.txt`, which already pins 50.0.0
# and its own `cffi`/`pycparser` requirements, so the offline wheelhouse install
# resolves it without reaching an index. Verifying a release signature is not
# somewhere to hand-roll a curve.
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
    "cryptography>=50.0.0,<51",
    # D04 conditional admission (owner acceptance 2026-10-01,
    # docs/quality/reviews/2026-10-01-d04-admission-acceptance.md in omnivia-pm;
    # D-0029): the two qualified analytical-dependency candidates, admitted as
    # EXACT pins. Conditions bind the WP03/WP05 use of them: the product grammar
    # admits no SET; the host enforces a spill-directory quota and supervisor
    # wall-time; external access closes at bootstrap and cannot re-open. The
    # executable-support gate (integration evidence per supported tuple) is
    # separate and remains open. Version retention of duckdb 1.5.5 (1.5.6
    # exists) is an explicit accepted risk decision (GHSA-w2gf-jxc9-pf2q affects
    # only < 1.1.0).
    "duckdb==1.5.5",
    "sqlglot==30.20.0",
]

[project.scripts]
omnivia-core-service = "omnivia_core_runtime.service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core_runtime"]
