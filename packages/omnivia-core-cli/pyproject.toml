[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core-cli"
version = "0.1.0"
description = "Skeleton CLI surface distribution for OmniVia Core (no operational behavior yet)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
    "omnivia-core-client>=0.1.0,<0.2.0",
]

[project.scripts]
omnivia = "omnivia_core_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core_cli"]
