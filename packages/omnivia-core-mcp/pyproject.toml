[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnivia-core-mcp"
version = "0.1.0"
description = "Skeleton MCP surface distribution for OmniVia Core (no operational behavior yet)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "omnivia-core>=0.1.0,<0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnivia_core_mcp"]
